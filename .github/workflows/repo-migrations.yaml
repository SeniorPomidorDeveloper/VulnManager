name: repo-migrations

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "migrations/**"
      - ".github/workflows/repo-migrations.yaml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: миграции неизменяемы
        run: |
          git diff --diff-filter=MD --name-only --exit-code \
            origin/${{ github.event.repository.default_branch }}...HEAD -- migrations
