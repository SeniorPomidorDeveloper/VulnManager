name: model

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "modules/model/**"
      - ".github/workflows/model.yaml"

env:
  GO_VERSION: "1.23.6"

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/model
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: modules/model/go.mod

      - run: make ci
