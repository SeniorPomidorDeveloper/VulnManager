name: processing

on:
  workflow_call:
  workflow_dispatch:

env:
  GO_VERSION: "1.23.6"

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/processing
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/processing/go.mod

      - run: make ci

  integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/processing
    env:
      TESTSUITE_PGSQL_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/processing/go.mod

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12.8"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rabbitmq-server

      - run: pip install -r tests/integration/requirements.txt

      - run: pip install --no-deps yandex-pgmigrate==1.0.13

      - run: make lint-py

      - run: make integration

  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/processing
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/processing/go.mod

      - run: sudo apt-get install -y --no-install-recommends debhelper dpkg-dev

      - run: make deb

      - run: make image

      - run: make smoke

      - if: always()
        run: make smoke-clean

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: vulnmanager-processing-deb
          path: services/processing/dist/*.deb
