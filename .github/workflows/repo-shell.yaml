name: repo-shell

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "ci/**"
      - "hooks/**"
      - ".github/workflows/repo-shell.yaml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - run: shellcheck ci/*.sh hooks/*
