name: ingest

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "services/ingest/**"

env:
  GO_VERSION: "1.23.6"
  GOFUMPT_VERSION: "0.7.0"
  GOLANGCI_VERSION: "2.1.6"
  SQLC_VERSION: "1.31.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "services/ingest/go.sum"

      - name: инструменты
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v${GOFUMPT_VERSION}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_VERSION}
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${SQLC_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: lint
        run: ci/lint.sh
        env:
          STRICT: "1"
          TARGET: services/ingest
          SKIP_REPO_CHECKS: "1"

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "services/ingest/go.sum"

      - name: инструменты
        run: |
          set -euo pipefail
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${SQLC_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: unit
        run: ci/unit.sh
        env:
          STRICT: "1"
          TARGET: services/ingest
