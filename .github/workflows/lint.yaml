name: lint

on:
  workflow_call:
    inputs:
      check_breaking:
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      check_breaking:
        description: "Проверять несовместимые изменения контрактов"
        type: choice
        options: ["1", "0"]
        default: "1"
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GO_VERSION: "1.23.6"
  GOFUMPT_VERSION: "0.7.0"
  GOLANGCI_VERSION: "2.1.6"
  BUF_VERSION: "1.47.2"
  YAMLLINT_VERSION: "1.35.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: инструменты
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v${GOFUMPT_VERSION}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_VERSION}
          go install github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pip install --no-cache-dir "yamllint==${YAMLLINT_VERSION}"

      - name: lint
        run: ci/lint.sh
        env:
          STRICT: "1"
          CHECK_BREAKING: ${{ inputs.check_breaking || '1' }}
          BASE_REF: origin/${{ github.event.repository.default_branch }}
