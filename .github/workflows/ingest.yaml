name: ingest

on:
  workflow_call:
  workflow_dispatch:

env:
  GO_VERSION: "1.23.6"

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/ingest/go.mod

      - run: make ci

  integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingest
    env:
      TESTSUITE_PGSQL_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/ingest/go.mod

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12.8"

      - run: pip install -r tests/integration/requirements.txt

      - run: make integration
