name: vulnmanager

services:
  postgres:
    image: postgres:16.6-alpine3.20
    profiles: ["infra", "core", "full"]
    restart: unless-stopped
    env_file:
      - deploy/local/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    profiles: ["infra", "full"]
    restart: unless-stopped
    env_file:
      - deploy/local/rabbitmq.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    profiles: ["infra", "core", "full"]
    restart: unless-stopped
    env_file:
      - deploy/local/garage.env
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900"
    volumes:
      - ./deploy/local/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-ingest:
    build: ./deploy/local/pgmigrate
    image: vulnmanager/pgmigrate:1.0.13
    profiles: ["core", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - deploy/local/postgres.env
    entrypoint:
      - sh
      - -c
      - >-
        pgmigrate -d /db
        -c "host=postgres dbname=$$POSTGRES_DB user=$$POSTGRES_USER password=$$POSTGRES_PASSWORD"
        -t latest migrate
    volumes:
      - ./migrations/ingest:/db/migrations:ro
    restart: "no"

  seed-ingest:
    image: postgres:16.6-alpine3.20
    profiles: ["core", "full"]
    depends_on:
      migrate-ingest:
        condition: service_completed_successfully
    env_file:
      - deploy/local/postgres.env
    entrypoint:
      - sh
      - -c
      - >-
        psql
        "host=postgres dbname=$$POSTGRES_DB user=$$POSTGRES_USER password=$$POSTGRES_PASSWORD"
        -v ON_ERROR_STOP=1 -f /seed/ingest.sql
    volumes:
      - ./testdata/seed/ingest.sql:/seed/ingest.sql:ro
    restart: "no"

  ingest:
    build:
      context: ./services/ingest/dist
      dockerfile: ../Dockerfile
      args:
        DEB: vulnmanager-ingest_0.0.1_amd64.deb
    image: vulnmanager/ingest:0.0.1
    profiles: ["core", "full"]
    restart: unless-stopped
    depends_on:
      seed-ingest:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
    env_file:
      - deploy/local/ingest.env
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /ping HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
