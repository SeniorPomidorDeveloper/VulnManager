version: "2"
sql:
  - engine: "postgresql"
    schema: "../../db/vulnmanager/migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "gen/db"
        sql_package: "pgx/v5"
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: "postgresql"
    schema: "schema/ingest_queue.sql"
    queries: "queue_queries"
    gen:
      go:
        package: "queuedb"
        out: "gen/queuedb"
        sql_package: "pgx/v5"
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
