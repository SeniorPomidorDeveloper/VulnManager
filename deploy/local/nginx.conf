server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        set $ingest http://ingest:8080;
        proxy_pass $ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
