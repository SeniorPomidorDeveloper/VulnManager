formats:
  - source: cve
    prefix: "CVE-"
    body: '\d{4}-\d{4,}'
    case: upper
  - source: ghsa
    prefix: "GHSA-"
    body: '([2-9cfghjmpqrvwx]{4}-){2}[2-9cfghjmpqrvwx]{4}'
    case: lower
  - source: nswg
    prefix: "NSWG-"
    body: '[a-z]+-\d+'
    case: upper
  - source: osv
    prefix: "OSV-"
    body: '\d{4}-\d+'
    case: upper
  - source: pysec
    prefix: "PYSEC-"
    body: '\d{4}-\d+'
    case: upper
  - source: bdu
    prefix: "BDU:"
    body: '\d{4}-\d{5}'
    case: keep
