name: repo-secrets

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "testdata/corpus/**"
      - ".github/workflows/repo-secrets.yaml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.23.6"
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - run: gitleaks dir testdata/corpus --no-banner
