name: rawstore

on:
  workflow_call:
  workflow_dispatch:

env:
  GO_VERSION: "1.23.6"

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modules/rawstore
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: modules/rawstore/go.mod

      - run: make ci
