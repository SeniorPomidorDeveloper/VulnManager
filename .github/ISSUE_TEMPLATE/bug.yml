name: Баг
description: Найденный дефект — воспроизводимая проблема
labels: ["type:fix"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - model
        - normalize
        - fingerprint
        - dedup
        - correlate
        - lifecycle
        - enrich
        - risk
        - parsers
        - pipeline
        - ingest
        - processing
        - feeds
        - reachability
        - assets
        - api
        - collectors
        - migrations
        - deploy
        - observability
        - bench
        - ci
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Тест, воспроизводящий баг
      description: Каждый баг-фикс приходит с таким тестом
    validations:
      required: false
