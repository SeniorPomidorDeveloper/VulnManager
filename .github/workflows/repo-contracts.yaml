name: repo-contracts

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "api/**"
      - "buf.gen.yaml"
      - ".github/workflows/repo-contracts.yaml"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.23.6"
          cache: false
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: buf breaking --against ".git#ref=refs/remotes/origin/${{ github.event.repository.default_branch }}"
      - run: buf generate
      - run: git diff --exit-code
      - run: npx --yes @stoplight/spectral-cli@6.14.2 lint "api/openapi/*.yaml"
